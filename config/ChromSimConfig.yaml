## =============================================================================
## ChromSimPipe configuration
## Edit paths below before running ChromSimPipe.sh.
## Locus, conditions, and physics parameters are all defined here —
## configs/parameters.py reads this file at import time.
## =============================================================================

## ── Sample sheet (CTCF peak file registry) ───────────────────────────────────
samplesheet: 'ChromSimSamplesheet.txt'

## ── Hi-C input files ─────────────────────────────────────────────────────────
## One entry per Hi-C map: <hic_type>: <absolute path to .hic>.
## The hic_type names are your choice (here condition1 / condition2); each condition's compare_hic must be
## one of them. Each map is converted to data/mcool/<hic_type>.cool.
hic:
  condition1: '/work/users/j/p/jpflores/projects/STRS/data/processed/hic/maps/YAPP_HEK293_eGFP-YAP_Cai_control_megaMap_inter_30.hic'
  condition2: '/work/users/j/p/jpflores/projects/STRS/data/processed/hic/maps/YAPP_HEK293_eGFP-YAP_Cai_sorbitol_megaMap_inter_30.hic'

## ── Genome FASTA ─────────────────────────────────────────────────────────────
## Used by scripts/extract_ctcf_sites_hg38.py (FIMO motif orientation).
## Longleaf default shown; change if running on a different cluster.
genome: '/proj/phanstiel_lab/Reference/human/hg38/fasta/GRCh38.primary_assembly.genome.fa'
genome_assembly: 'hg38'

## ── Resolution ───────────────────────────────────────────────────────────────
resolution: 1000   # bp per monomer

## ── Job counts ───────────────────────────────────────────────────────────────
n_replicates: 3    # independent GPU runs per condition
n_shards: 4        # GPU shards per replicate (frames = n_replicates × n_shards × total_blocks/save_every)

## ── Software ─────────────────────────────────────────────────────────────────
pythonVers: '3.12.4'


## =============================================================================
## Locus
## Change these to run a different genomic region.
## region_start / region_end define the full simulation window (~2 Mb).
## anchor_bp is the midpoint of the figure window — used for MSD probe selection.
## =============================================================================
locus:
  name:         chr1_fig1
  chrom:        chr1
  region_start: 64210000   # full 2 Mb simulation window
  region_end:   66170000
  label:        "chr1 Fig1 gained+lost (JAK1/AK4/LEPR locus)"
  anchor_bp:    65190000   # midpoint of figure window 64.71–65.67 Mb


## =============================================================================
## Simulation conditions
## Each entry is one cohesin × CTCF combination.
##
## Fields:
##   name         — unique identifier; used in output directory names
##   params_name  — prefix for the shard directory (must be unique within a ctcf_type)
##   lifetime     — mean cohesin lifetime in SMC steps (~kb processivity = lifetime × resolution)
##   separation   — inter-cohesin spacing in monomers
##   ctcf_capture — stalling probability per CTCF encounter (0–1)
##   ctcf_release — escape probability per step while stalled (0–1)
##   ctcf_type    — CTCF peak set to load; must match a CTCF_Type in the samplesheet
##   compare_hic  — which Hi-C map (a key under `hic:`) to compare against
## =============================================================================
conditions:

  ## 1. Baseline: does the model reproduce condition 1 Hi-C?
  - name:         cond1_baseline
    description:  "Baseline cohesin + condition 1 CTCF sites"
    params_name:  baseline
    lifetime:     75
    separation:   240
    ctcf_capture: 0.125
    ctcf_release: 0.0033
    ctcf_type:    condition1
    compare_hic:  condition1

  ## 2. CTCF change only: do condition 2 CTCF sites alone explain condition 2 Hi-C?
  - name:         cond2_ctcf-only
    description:  "Baseline cohesin + condition 2 CTCF sites (CTCF effect only)"
    params_name:  ctcf_only
    lifetime:     75
    separation:   240
    ctcf_capture: 0.125
    ctcf_release: 0.0033
    ctcf_type:    condition2
    compare_hic:  condition2

  ## 3. Weaker stalling at condition 2 CTCF sites (0.5x capture probability)
  - name:         cond2_weak-ctcf
    description:  "Baseline cohesin + condition 2 CTCF sites + reduced stalling (0.5x)"
    params_name:  weak_ctcf
    lifetime:     75
    separation:   240
    ctcf_capture: 0.0625
    ctcf_release: 0.0033
    ctcf_type:    condition2
    compare_hic:  condition2


## =============================================================================
## Polymer physics  (advanced — Gabriele et al. 2022 defaults)
## Most users should not need to change these.
## =============================================================================
polymer:
  density:          0.2
  bond_length:      1.0
  bond_wiggle_dist: 0.05
  angle_force:      1.5
  collision_rate:   0.03
  error_tol:        0.003
  platform:         CUDA    # "CPU" for testing without a GPU

smc_bond:
  wiggle_dist: 0.2
  bond_dist:   0.5

## Tiling: 28 back-to-back copies of the locus on a 70 000-monomer chromosome.
## Gives 28x more contact statistics per GPU run (Yang et al. 2023 Nat Commun).
## tile_size must equal (region_end - region_start) / resolution + 2 * padding.
tiling:
  tile_size:  2500
  chrom_size: 70000
  padding:    270

sim_run:
  smc_steps_per_block:  1
  md_steps_per_block:   250
  total_blocks:         50000
  warmup_blocks:        4000
  save_every:           10
  restart_milker_every: 100
  contact_radius:       3.0
