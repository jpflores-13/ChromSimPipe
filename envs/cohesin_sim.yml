name: cohesin_sim
## Simulation + Hi-C conversion + analysis. conda-forge and bioconda only:
## mixing in `defaults` gives inconsistent solves (and Anaconda's channel has
## licensing terms); set `conda config --set channel_priority strict`.
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- Core ---
  - python=3.10
  - numpy<2          # hic2cool and polychrom predate NumPy 2
  - scipy
  - h5py             # simulation output (polychrom HDF5Reporter) and merging
  - pandas           # summary tables
  - pyyaml           # configs/parameters.py reads the config

  # --- OpenMM + CUDA
  # CUDA 12: CUDA 13 dropped Pascal (GTX 10xx) and Volta (V100) GPUs, so a
  # CUDA 13 OpenMM fails on those nodes with "nvrtc: invalid value for
  # --gpu-architecture". CUDA 12 runs on Pascal through Ada/Hopper (needs an
  # NVIDIA driver >= 525). Do NOT pin the old `cudatoolkit` package.
  - openmm
  - cuda-version=12

  # --- Hi-C data processing ---
  - cooler           # reads .cool files (experimental_compare.py, ps_curve.py)
  - cooltools        # analysis helpers
  - hic2cool         # converts .hic → .cool (convertHic rule)
  - multiprocess     # required by hic2cool but missing from its conda package

  # --- Analysis & visualization ---
  - matplotlib
  - openpyxl         # Excel output in summarize_analysis.py

  # --- Build tools for polychrom (installed from source by pip) ---
  - cython
  - setuptools
  - pip
  - pip:
    - git+https://github.com/open2c/polychrom.git
