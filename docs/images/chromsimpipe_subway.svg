<text x="24.0" y="796.8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">names a local motif file. simulateShard also reads factor peak files from the samplesheet when a condition uses sticky, loading or pausing options. Hi-C</text>
<text x="24.0" y="814.8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">(.hic, .mcool or .cool) is used only to compare with the simulations; it never enters them.</text>
