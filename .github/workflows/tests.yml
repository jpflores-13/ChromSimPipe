name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: config/requirements.txt

      - name: Install Snakemake (config/requirements.txt) and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r config/requirements.txt pytest pyyaml numpy scipy

      - name: Run tests
        ## The full dry-run tests need the real inputs linked into data/
        ## (data/README.md); they are skipped here and reported with -rs.
        run: python -m pytest -rs tests
