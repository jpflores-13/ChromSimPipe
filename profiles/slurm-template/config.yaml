## Template for any SLURM cluster. Copy this folder (e.g. to profiles/<cluster>/),
## fill in the <...> values, and select it on that cluster with
## `export CHROMSIM_PROFILE=profiles/<cluster>` in ~/.bashrc (or --profile).
## `sinfo -s` lists partitions; `sacctmgr show assoc user=$USER` lists accounts.
executor: slurm
jobs: 100
latency-wait: 500
software-deployment-method: conda

default-resources:
  slurm_account: <account>          # delete this line if your cluster has no accounts
  slurm_partition: <cpu partition>
  runtime: 4320                     # minutes
  cpus_per_task: 1
  mem_mb: 16000
  nodes: 1

## Per-rule resources (rules carry no resources of their own)
set-resources:
  convertHic:
    runtime: 480                  # 1.6 h for a 3.7 GB .hic on Longleaf
    cpus_per_task: 4
    mem_mb: 32000
  getMotif:
    runtime: 15
    mem_mb: 1000
  orientCTCF:
    runtime: 60
    cpus_per_task: 2
    mem_mb: 16000
  validateCTCF:
    runtime: 15
    mem_mb: 4000
  preparePolysim:                 # builds polysim's Cython LEF model once
    runtime: 30
    mem_mb: 4000
  simulateShard:
    runtime: 720
    slurm_partition: <gpu partition>
    gpu: 1                          # becomes --gpus=1. Prefer this: on Pioneer a
                                    # gres: "'gpu:1'" request was never submitted.
    # qos: <gpu qos>                # only if your site requires a QOS for GPUs
    cpus_per_task: 4
    mem_mb: 60000
  mergeShards:
    runtime: 120
    cpus_per_task: 4
    mem_mb: 64000
  analyzeCondition:
    runtime: 1440                 # 24 h; a full run (150,000 frames) took 4.5 h to > 6 h
    cpus_per_task: 4                # keep >= analysis.n_jobs in the config
    mem_mb: 64000
  benchmarkSummary:
    runtime: 15
    mem_mb: 2000
