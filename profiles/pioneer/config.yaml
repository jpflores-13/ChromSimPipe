## Case Western Pioneer (SLURM). Values from `sinfo -s`, `sacctmgr show assoc`
## and `scontrol show partition` on the Pioneer login nodes.
## Select it on Pioneer with `export CHROMSIM_PROFILE=profiles/pioneer` in ~/.bashrc.
executor: slurm
jobs: 100
latency-wait: 500
software-deployment-method: conda

default-resources:
  slurm_account: pjt5_1           # your association (its QOS, gpuext2, applies by default)
  slurm_partition: batch          # default CPU partition
  runtime: 4320                   # minutes; Pioneer allows up to 13 days 8 h
  cpus_per_task: 1
  mem_mb: 16000
  nodes: 1
## SLURM job logs go to <outputDir>/logs_slurm (--slurm-logdir in ChromSimPipe.sh)

## Per-rule resources (rules carry no resources of their own)
set-resources:
  convertHic:
    runtime: 480                  # 1.6 h for a 3.7 GB .hic on Longleaf
    cpus_per_task: 4
    mem_mb: 32000
  getMotif:
    runtime: 15
    mem_mb: 1000
  orientCTCF:
    runtime: 60
    cpus_per_task: 2
    mem_mb: 16000
  validateCTCF:
    runtime: 15
    mem_mb: 4000
  preparePolysim:                 # builds polysim's Cython LEF model once
    runtime: 30
    mem_mb: 4000
  simulateShard:
    runtime: 720
    slurm_partition: gpu          # 39 nodes, 114 GPUs
    gpu: 1                        # becomes --gpus=1 (a gres request was never submitted
                                  # by the SLURM plugin here; --gpus=1 is accepted)
    cpus_per_task: 4
    mem_mb: 60000
  mergeShards:
    runtime: 120
    cpus_per_task: 4
    mem_mb: 64000
  analyzeCondition:
    runtime: 1440                 # 24 h; a full run (150,000 frames) took 4.5 h to > 6 h
    cpus_per_task: 4              # keep >= analysis.n_jobs in the config
    mem_mb: 64000
  benchmarkSummary:
    runtime: 15
    mem_mb: 2000
